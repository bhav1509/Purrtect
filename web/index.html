<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Purrtect Scam Checker</title>
  <meta name="description" content="Paste a message, enter a link or upload a screenshot. Purrtect explains whether it looks like a scam and helps you recover.">
  <link rel="icon" href="mascots/cat/idle.png">
  <link rel="stylesheet" href="ui/ui.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header class="top">
      <img id="mascot" class="purr-mascot" src="mascots/cat/idle.png" alt="" width="96" height="96">
      <div>
        <h1 data-i18n="web_title">Is this a scam?</h1>
        <p class="tagline" data-i18n="web_tagline"></p>
      </div>
    </header>

    <section class="prefs" aria-label="Preferences">
      <label><span data-i18n="set_language">Language</span>
        <select id="lang">
          <option value="en">English</option>
          <option value="hi">हिन्दी</option>
          <option value="ja">日本語</option>
          <option value="zh_CN">简体中文</option>
        </select>
      </label>
      <label><span data-i18n="set_country">Your country</span>
        <select id="country"></select>
      </label>
      <div class="pet-picker" role="radiogroup" aria-label="Mascot">
        <span data-i18n="set_mascot">Your buddy</span>
        <div id="pets"></div>
      </div>
    </section>

    <section class="checker">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="text" aria-selected="true" data-i18n="web_tab_text"></button>
        <button type="button" role="tab" data-tab="link" aria-selected="false" data-i18n="web_tab_link"></button>
        <button type="button" role="tab" data-tab="image" aria-selected="false" data-i18n="web_tab_image"></button>
      </div>

      <form id="form" novalidate>
        <div class="panel" data-panel="text">
          <label for="text" data-i18n="web_text_label"></label>
          <textarea id="text" rows="7"></textarea>
          <p class="hint" data-i18n="web_privacy"></p>
        </div>
        <div class="panel" data-panel="link" hidden>
          <label for="link" data-i18n="web_link_label"></label>
          <input id="link" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://">
        </div>
        <div class="panel" data-panel="image" hidden>
          <label for="image" data-i18n="web_image_label"></label>
          <input id="image" type="file" accept="image/png,image/jpeg,image/webp">
          <p class="hint warn" data-i18n="web_image_notice"></p>
        </div>
        <p id="formError" class="error" hidden></p>
        <button id="submit" class="purr-btn purr-btn-primary" type="submit" data-i18n="web_check"></button>
      </form>

      <h2 data-i18n="web_samples"></h2>
      <div id="samples" class="samples"></div>
    </section>

    <div id="result" aria-live="polite"></div>
    <div id="recovery"></div>

    <section class="get-ext">
      <h2 data-i18n="web_get_extension"></h2>
      <ol>
        <li data-i18n="web_install_1"></li>
        <li data-i18n="web_install_2"></li>
        <li data-i18n="web_install_3"></li>
      </ol>
      <a id="download" class="purr-btn" href="https://github.com/bhav1509/Purrtect/releases/latest" target="_blank" rel="noopener" data-i18n="web_download"></a>
    </section>

    <footer data-i18n="tagline"></footer>
  </main>

  <script src="rules.js"></script>
  <script src="ui/core.js"></script>
  <script src="ui/verdict-card.js"></script>
  <script src="ui/recovery-panel.js"></script>
  <script src="samples.js"></script>
  <script src="app.js"></script>
</body>
</html>
